name: fetch

on:
  schedule:
    # v1.16.1 统一重排：GitHub 定时排队延迟实测 26~36 分钟，所有节点档一律
    # 「提前 30 分钟预触发 + 脚本内等到节点后 1 分钟再取价」（等待逻辑见 fetch.py
    # 开头），落地时间稳定贴着节点，不再吃延迟的亏。cron 为 UTC，北京 = UTC + 8。
    - cron: '50 1 * * *'   # 北京 09:50 · 10:15 档预触发轮（脚本内等到 10:16:05 再取价）
    - cron: '55 1 * * *'   # 北京 09:55 · 10:15 档预触发轮（保险，同上）
    - cron: '17 2 * * *'   # 北京 10:17 · 10:15 档（原轮次保留，预轮若被丢时兜底）
    - cron: '22 2 * * *'   # 北京 10:22 · 10:15 档保险轮（原保险保留）
    - cron: '0 3 * * *'    # 北京 11:00 · 11:30 档预触发（等到 11:31:05；旧 11:32 触发延迟后 11:58 才落地，午休看不到）
    - cron: '0 4 * * *'    # 北京 12:00 · 马棕油上午收盘档（落地约 12:26~12:36，供 13:30 前参考；兼 11:30 保险轮）
    - cron: '30 6 * * *'   # 北京 14:30 · 15:00 日盘收盘档预触发（等到 15:01:05；旧 15:02 触发延迟后 15:28 才落地）
    - cron: '22 7 * * *'   # 北京 15:22 · 保险轮（预轮若遇数据源延迟，本轮自动修正；数据无变化时不产生提交）
    - cron: '30 11 * * *'  # 北京 19:30 · 马棕油下午收盘档（落地约 19:56~20:06，供 21:00 前参考；兼 15:00 保险轮）
    - cron: '30 14 * * *'  # 北京 22:30 · 23:00 夜盘收盘档预触发（等到 23:01:05）
    - cron: '30 16 * * *'  # 北京 00:30 · 01:00 LME 有色收盘档预触发（等到 01:01:05）
    - cron: '0 18 * * *'   # 北京 02:00 · 02:30 贵金属收盘档预触发（等到 02:31:05）
    - cron: '50 20 * * *'  # 北京 04:50 · 夜盘汇总兜底（落地约 05:16~05:26。旧 05:35 触发延迟后 06:01~06:11 落地，正好撞进本想避开的 CME 06:00 分时切换窗口，故再提前）
    - cron: '45 23 * * *'  # 北京 07:45 · 美股日线定格（轻量：只更新美股三行；新浪美股日K更新晚于 05:30 判据，此时补最新）
    - cron: '0 0 * * *'    # 北京 08:00 · 早盘前隔夜修正轮（延迟后约 08:26~08:36 落地，赶在国内 09:00 开盘前把隔夜档修正到位，含换月锚定修正）
  workflow_dispatch:       # 手动触发：随时想看最新数据，Actions 页点 Run workflow，约 2 分钟后刷新网页即可

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 拉取数据（全量）
        if: github.event.schedule != '45 23 * * *'
        run: python fetch.py

      - name: 拉取数据（美股专项 · 07:45 轮）
        if: github.event.schedule == '45 23 * * *'
        run: python fetch.py --us-only

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "update data $(date -u +%FT%TZ)"
          # 相邻轮次（07:45 美股轮 / 08:00 早盘前轮）撞车时先合流再推，避免非快进失败
          git pull --rebase
          git push
