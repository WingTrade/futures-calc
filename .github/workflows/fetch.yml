name: fetch

on:
  schedule:
    # 只在「起始价切换节点」后几分钟跑，其余时间不跑（cron 为 UTC，北京 = UTC + 8）
    - cron: '50 1 * * *'   # 北京 09:50 · 10:15 档预触发轮（实测 GitHub 定时排队延迟 26~36 分钟，把延迟吃进触发点；脚本内若执行过早会自动等待到 10:16 再取价）
    - cron: '55 1 * * *'   # 北京 09:55 · 10:15 档预触发轮（保险，同上）
    - cron: '17 2 * * *'   # 北京 10:17 · 10:15 档（原轮次保留，预轮若被丢时兜底）
    - cron: '22 2 * * *'   # 北京 10:22 · 10:15 档保险轮（原保险保留）
    - cron: '32 3 * * *'   # 北京 11:32 · 11:30 档（午休段起算，至 13:30 开盘）
    - cron: '32 4 * * *'   # 北京 12:32 · 马棕油上午收盘档（12:30 收盘后刷新，供 13:30 前参考；兼 11:32 保险轮）
    - cron: '2 7 * * *'    # 北京 15:02 · 日盘收盘（15:00 节点）
    - cron: '22 7 * * *'   # 北京 15:22 · 保险轮（15:02 若遇数据源延迟，本轮自动修正；数据无变化时不产生提交）
    - cron: '2 12 * * *'   # 北京 20:02 · 马棕油下午收盘档（17:00 收盘后刷新，供 21:00 前参考；兼 15:02 保险轮）
    - cron: '2 15 * * *'   # 北京 23:02 · 夜盘普通品种收盘（23:00 节点）
    - cron: '2 17 * * *'   # 北京 01:02（凌晨）· LME 有色收盘（01:00 节点）
    - cron: '32 18 * * *'  # 北京 02:32（凌晨）· 贵金属收盘（02:30 节点）
    - cron: '35 21 * * *'  # 北京 05:35（凌晨）· 夜盘汇总兜底（原 05:50 提前，避开 CME 06:00 分时切换窗口，防参考价被顶掉）
    - cron: '45 23 * * *'  # 北京 07:45 · 美股日线定格（轻量：只更新美股三行；新浪美股日K更新晚于 05:30 判据，此时补最新）
  workflow_dispatch:       # 手动触发：随时想看最新数据，Actions 页点 Run workflow，约 2 分钟后刷新网页即可

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 拉取数据（全量）
        if: github.event.schedule != '45 23 * * *'
        run: python fetch.py

      - name: 拉取数据（美股专项 · 07:45 轮）
        if: github.event.schedule == '45 23 * * *'
        run: python fetch.py --us-only

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "update data $(date -u +%FT%TZ)"
          git push
