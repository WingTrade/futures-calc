<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>外盘涨跌统计</title>
<style>
  :root{
    --header-bg:#1E3A5F; --up:#D6263B; --down:#0B8043; --zero:#555;
    --miss:#999; --grid:#DFE6EF; --row-a:#fff; --row-b:#F2F6FB;
    --name-a:#E9EEF6; --name-b:#DDE5F1; --text:#333;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;
    background:#eef2f7; color:var(--text); padding:6px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:fit-content; max-width:100%; margin:0 auto;}
  .head{
    background:var(--header-bg); color:#fff; border-radius:7px 7px 0 0;
    padding:6px 10px; display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:4px;
    contain:inline-size; width:100%;
  }
  .head h1{font-size:13px; font-weight:700;}
  .head .meta{font-size:11px; opacity:.92; text-align:right; line-height:1.35;}
  .head .meta .time{font-size:12px; font-weight:600; color:#FFE08A;}
  .lamps{display:flex; gap:9px; align-items:center; font-size:11px;}
  .lamp{display:flex; align-items:center; gap:4px;}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block;}
  .dot.g{background:#2ecc71;} .dot.r{background:#e74c3c;}
  .block{
    width:fit-content; max-width:100%; margin:0 auto; background:#fff;
    border-radius:0 0 7px 7px; overflow:hidden;
  }
  table{border-collapse:collapse; font-size:12px;}
  thead th{
    background:var(--header-bg); color:#fff; font-weight:600; padding:3px 6px;
    font-size:11px; white-space:nowrap;
  }
  tbody td{
    padding:1px 6px; text-align:right; border-bottom:1px solid var(--grid);
    line-height:1.25; white-space:nowrap;
  }
  tbody tr:last-child td{border-bottom:none;}
  td.name{text-align:left; font-weight:600; color:var(--header-bg); padding-left:9px;}
  tr:nth-child(even) td{background:var(--row-b);}
  tr:nth-child(even) td.name{background:var(--name-b);}
  tr:nth-child(odd) td.name{background:var(--name-a);}
  .up{color:var(--up); font-weight:600;}
  .down{color:var(--down); font-weight:600;}
  .zero{color:var(--zero);}
  .miss{color:var(--miss);}
  th.ref, td.ref{font-size:11px; color:#777; text-align:center; padding-left:4px; padding-right:4px;}
  .foot{
    background:#fff; border-top:1px solid var(--grid); border-radius:0 0 7px 7px;
    padding:5px 10px; font-size:11px; color:#999; line-height:1.5; margin-top:1px;
    contain:inline-size; width:100%;
  }
  .foot .warn{color:#c0392b;}
  .tip{margin-top:4px; text-align:center; font-size:11px; color:#aab; contain:inline-size; width:100%;}
  @media (max-width:520px){
    body{padding:4px;}
    td{padding:1px 4px;}
    .block{overflow-x:auto;}
  }
  @media (max-width:380px){
    td{padding:1px 3px;}
    td.name{padding-left:4px;}
  }
  /* 大屏适配：整体等比放大（字大→表格自然更宽），高分辨率屏上不再显小 */
  @media (min-width:1440px){
    table{font-size:18px;}
    thead th{padding:5px 11px; font-size:16px;}
    tbody td{padding:3px 11px; line-height:1.3;}
    td.name{padding-left:16px;}
    td.ref{font-size:14px; padding-left:8px; padding-right:8px;}
    .head h1{font-size:18px;}
    .head .meta{font-size:14px;}
    .head .meta .time{font-size:16px;}
    .lamps{font-size:14px;}
    .foot{font-size:14px;}
    .tip{font-size:14px;}
  }
  /* 2K 及以上（宽 ≥1920）：再放大一档 */
  @media (min-width:1920px){
    table{font-size:24px;}
    thead th{padding:7px 14px; font-size:21px;}
    tbody td{padding:4px 14px; line-height:1.3;}
    td.name{padding-left:20px;}
    td.ref{font-size:19px; padding-left:10px; padding-right:10px;}
    .head h1{font-size:24px;}
    .head .meta{font-size:18px;}
    .head .meta .time{font-size:21px;}
    .lamps{font-size:18px;}
    .foot{font-size:18px;}
    .tip{font-size:18px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1 id="title">外盘涨跌统计</h1>
    <div class="meta">
      <div class="time" id="genTime">加载中…</div>
      <div id="modeDesc"></div>
    </div>
    <div class="lamps">
      <span class="lamp"><span class="dot" id="dotEm"></span><span id="lblEm">东财</span></span>
      <span class="lamp"><span class="dot" id="dotSina"></span><span id="lblSina">新浪</span></span>
    </div>
  </div>
  <div class="block">
    <table>
      <thead>
        <tr>
          <th style="text-align:left; padding-left:9px;">品种名称</th>
          <th>起始价</th><th>最新价</th><th>对比涨跌</th><th>涨跌幅</th>
          <th class="ref">起始时间</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="foot">
    <div id="refDesc"></div>
    <div class="warn">不构成投资建议｜数据可能有延迟或错误，请谨慎参考</div>
  </div>
  <div class="tip">页面每 60 秒检查新数据 · 行情每小时自动更新一轮</div>
  <div class="tip">想立刻刷新数据？<a href="https://github.com/WingTrade/futures-calc/actions/workflows/fetch.yml" target="_blank" rel="noopener" style="color:#4A79B8;">点这里跑一轮</a>（约 2 分钟，跑完本页自动更新，无需其他操作）</div>
</div>

<script>
function fmt2(v, signed){
  if(v==null) return '—';
  if(Math.abs(v)<0.005) return '0.00';
  return (signed?(v>0?'+':''):'') + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fmtPct(v){
  if(v==null) return '—';
  if(Math.abs(v)<0.005) return '0.00%';
  return (v>0?'+':'') + v.toFixed(2) + '%';
}
function cls(v){
  if(v==null) return 'miss';
  if(Math.abs(v)<0.005) return 'zero';
  return v>0?'up':'down';
}
var SHORT_NAMES = { '新加坡铁矿石': '新加坡铁矿' };
function rowHtml(r){
  var nm = SHORT_NAMES[r.name] || r.name;
  var flag = r.flag ? ' ※' : '';
  return '<td class="name">'+nm+'</td>'+
    '<td class="'+(r.close==null?'miss':'')+'">'+fmt2(r.close)+'</td>'+
    '<td class="'+(r.last==null?'miss':'')+'">'+fmt2(r.last)+'</td>'+
    '<td class="'+cls(r.chg)+'">'+fmt2(r.chg,true)+'</td>'+
    '<td class="'+cls(r.pct)+'">'+fmtPct(r.pct)+flag+'</td>'+
    '<td class="ref">'+(r.ref||'—')+'</td>';
}
function render(d){
  document.getElementById('title').textContent = d.mode==='day' ? '对比15:00涨跌统计（日间）' : '隔夜涨跌统计';
  document.getElementById('genTime').textContent = '更新于 ' + d.generated_at;
  document.getElementById('modeDesc').textContent = d.mode_desc || '';
  setLamp('dotEm','lblEm', d.em_ok);
  setLamp('dotSina','lblSina', d.sina_ok);
  document.getElementById('refDesc').textContent = d.ref_desc || '';
  var tb = document.getElementById('tbody');
  tb.innerHTML = '';
  var rows = d.rows || [];
  for(var i=0;i<rows.length;i++){
    var tr = document.createElement('tr');
    tr.innerHTML = rowHtml(rows[i]);
    tb.appendChild(tr);
  }
}
function setLamp(dotId, lblId, ok){
  document.getElementById(dotId).className = 'dot ' + (ok?'g':'r');
  document.getElementById(lblId).style.color = ok?'#2ecc71':'#e74c3c';
}
async function load(){
  try{
    var r = await fetch('data.json?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    render(await r.json());
  }catch(e){
    document.getElementById('genTime').textContent = '数据加载失败';
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
